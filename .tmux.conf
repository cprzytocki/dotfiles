set -g default-terminal "tmux-256color"
# set -ag terminal-overrides ",xterm-256color:RGB"
set -g base-index 1 # start windows numbering at 1 
set-option -g renumber-windows on

# sesh stuff
bind-key x kill-pane # skip "kill-pane 1? (y/n)" prompt
set -g detach-on-destroy off  # don't exit from tmux when closing a session
bind -N "last-session (via sesh) " L run-shell "sesh last"

set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

unbind |
bind | split-window -v 

unbind -
bind - split-window -h

unbind r
bind r source-file ~/.tmux.conf

bind Enter resize-pane -Z

bind e run-shell 'code -r "#{pane_current_path}"'

bind-key "k" run-shell "~/.config/scripts/sesh-connect.sh \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find ^w worktrees' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-w:change-prompt(🌿  )+reload(~/.config/scripts/wt-sesh-list.sh)' \
    --bind 'ctrl-d:execute(~/.config/scripts/sesh-kill.sh {})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

bind-key "W" command-prompt -p "worktree branch:" \
  "run-shell '~/.config/scripts/wt-create.sh \"#{pane_current_path}\" \"%1\"'"

# bind j resize-pane -D 5
# bind k resize-pane -U 5
# bind l resize-pane -R 5
# bind h resize-pane -L 5

# bind -r m resize-pane -Z

# set -g @plugin 'tmux-plugins/tmux-yank'

set -g mouse on

# Reduce mouse scroll speed (1 lines per tick instead of default 5)
bind-key -T copy-mode-vi WheelUpPane send-keys -X -N 1 scroll-up
bind-key -T copy-mode-vi WheelDownPane send-keys -X -N 1 scroll-down

set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
# set -g status-right "#{E:@catppuccin_status_application}"
# set -agF status-right "#{E:@catppuccin_status_cpu}"
set -g status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#[fg=#{E:@thm_blue},bg=default]#(git -C '#{pane_current_path}' rev-parse --abbrev-ref HEAD 2>/dev/null | sed 's/^/  /')"
# set -ag status-right "#{E:@catppuccin_status_session}"
# set -ag status-right "#{E:@catppuccin_status_uptime}"
# set -agF status-right "#{E:@catppuccin_status_battery}"
set-window-option -g mode-keys vi

# Copy mode visual indicator - change status bar style
set-hook -g pane-mode-changed 'if-shell "[ #{pane_in_mode} -eq 1 ]" \
  "set-option -g status-style bg=yellow,fg=black" \
  "set-option -g status-style default"'
set-hook -g pane-focus-in 'if-shell "[ #{pane_in_mode} -eq 1 ]" \
  "set-option -g status-style bg=yellow,fg=black" \
  "set-option -g status-style default"'

# bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
# bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"

# unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode when dragging with mouse

# # remove delay for exiting insert mode with ESC in Neovim
# set -sg escape-time 10

# # tpm plugin
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'catppuccin/tmux#v2.1.3' # See https://github.com/catppuccin/tmux/tags for additional tags
# set -g @plugin 'tmux-plugins/tmux-cpu'
# set -g @plugin 'tmux-plugins/tmux-battery'

# set -g @plugin 'christoomey/vim-tmux-navigator'
# set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
# set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes

# set -g @resurrect-capture-pane-contents 'on'
# set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
